<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    
    <link rel="stylesheet" href="../css/style.css"> 
</head>
<body>

    <div class="login-container">
        
        <img src="../img/logo.png" alt="Logo de la Plataforma" class="logo">
        
        <h2>Recuperar Contraseña</h2>
        <p>Introduce tu correo electrónico para que te enviemos un enlace de restablecimiento.</p>

        <form action="#" method="POST">
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="ej. JPEREZ@senati.pe" required>
            </div>
            
            <button type="submit" class="login-btn">Enviar Enlace</button>
        </form>

        <div class="links">
            <a href="../index.html">Volver a Inicio de Sesión</a>
        </div>
    </div>

</body>
</html>
